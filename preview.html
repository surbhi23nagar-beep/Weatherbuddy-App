<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Weather Buddy — Preview</title>
  <style>
    :root {
      --bg: #1a2332;
      --frame: #0e141c;
      --bezel: #2a3544;
      --screen: #9ec9e6;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background:
        radial-gradient(ellipse 80% 60% at 50% 20%, #2a3f55 0%, transparent 55%),
        var(--bg);
      color: #e8eef5;
      font-family: "Segoe UI", system-ui, sans-serif;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px 16px 40px;
      gap: 20px;
    }

    header {
      text-align: center;
      max-width: 28rem;
    }

    header h1 {
      margin: 0 0 6px;
      font-size: 1.35rem;
      font-weight: 650;
      letter-spacing: -0.02em;
    }

    header p {
      margin: 0;
      font-size: 0.9rem;
      opacity: 0.72;
      line-height: 1.4;
    }

    .phone {
      width: min(390px, 100%);
      aspect-ratio: 9 / 19.5;
      background: var(--frame);
      border-radius: 36px;
      padding: 12px;
      box-shadow:
        0 0 0 1px #3a4a5c,
        0 24px 60px rgba(0, 0, 0, 0.45);
      position: relative;
    }

    .phone::before {
      content: "";
      position: absolute;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      width: 96px;
      height: 10px;
      background: var(--bezel);
      border-radius: 999px;
      z-index: 2;
    }

    .screen {
      width: 100%;
      height: 100%;
      border: 0;
      border-radius: 26px;
      background: var(--screen);
      display: block;
    }

    footer {
      font-size: 0.8rem;
      opacity: 0.55;
      text-align: center;
    }

    footer code {
      font-size: 0.78rem;
      background: rgba(255, 255, 255, 0.08);
      padding: 2px 6px;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <header>
    <h1>Weather Buddy</h1>
    <p>Phone preview of the Flutter + Rive weather screen.</p>
  </header>

  <div class="phone" aria-label="Phone preview frame">
    <!-- Flutter web "simulator" preview (same view as before). -->
    <iframe
      class="screen"
      id="app"
      title="Weather Buddy app"
      src="http://127.0.0.1:43123/"
      allow="fullscreen"
    ></iframe>
  </div>

  <footer>
    Open the app directly if the frame is blank:
    <a href="http://127.0.0.1:43123/" style="color:#9ec9e6">http://127.0.0.1:43123/</a>
  </footer>
</body>
</html>
